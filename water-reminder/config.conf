# Water Reminder Configuration File
# Time between reminders in minutes (default: 30)
REMINDER_INTERVAL=30

# Enable/disable sound notifications (true/false)
SOUND_ENABLED=true

# Log file location (default: ~/.local/share/water-reminder/water-reminder.log)
LOG_FILE="$HOME/.local/share/water-reminder/water-reminder.log"

# PID file location (default: ~/.local/share/water-reminder/water-reminder.pid)
PID_FILE="$HOME/.local/share/water-reminder/water-reminder.pid"

# Auto-start on login (true/false)
AUTO_START=false

# Custom notification messages (one per line, will be selected randomly)
MESSAGES=(
    "💧 Time to drink some water! Stay hydrated! 💧"
    "🚰 Don't forget to hydrate! Your body needs water! 🚰"
    "💦 Water break time! Keep yourself healthy! 💦"
    "🥤 Hydration reminder: Drink a glass of water now! 🥤"
    "💧 Your body is calling for water! Take a sip! 💧"
    "🌊 Stay refreshed! Time for some H2O! 🌊"
    "💦 Reminder: Keep your energy up with water! 💦"
    "🚰 Health tip: Drink water regularly throughout the day! 🚰"
)

# Notification icon path (will be set by installation script)
ICON_PATH="$HOME/.local/share/water-reminder/icons/water-drop.png"

# Notification urgency level (low, normal, critical)
URGENCY="normal"

# Notification timeout in milliseconds (0 = never expire)
TIMEOUT=5000